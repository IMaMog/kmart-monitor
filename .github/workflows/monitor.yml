name: Kmart Pokemon monitor

on:
  schedule:
    # Fires ~7 min before each quarter hour; the script then sleeps until exactly
    # hh:00:01 / hh:15:01 / hh:30:01 / hh:45:01. The head start absorbs GitHub's
    # scheduling delay (busiest right on the hour), so the check itself lands on time.
    # One line per slot so the run knows which slot it's for even if GitHub starts it late.
    - cron: "53 * * * *"   # -> hh:00:01
    - cron: "8 * * * *"    # -> hh:15:01
    - cron: "23 * * * *"   # -> hh:30:01
    - cron: "38 * * * *"   # -> hh:45:01
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a sample alert instead of a normal run"
        type: boolean
        default: false
      no_proxy:
        description: "Direct only: don't fall back to KMART_PROXY this run"
        type: boolean
        default: false
      proxy_only:
        description: "Go straight through KMART_PROXY this run (to test the proxy)"
        type: boolean
        default: false

permissions:
  contents: write   # to commit state.json

concurrency:
  group: kmart-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOARD_WEBHOOK_URL: ${{ secrets.DISCORD_BOARD_WEBHOOK_URL }}
          DISCORD_PING: ${{ vars.DISCORD_PING }}
          INCLUDE_ACCESSORIES: ${{ vars.INCLUDE_ACCESSORIES }}
          KMART_STATE: ${{ vars.KMART_STATE }}
          KMART_PROXY: ${{ secrets.KMART_PROXY }}
        run: |
          if [ "${{ inputs.no_proxy }}" = "true" ]; then
            unset KMART_PROXY
            echo "no_proxy ticked: direct only, no proxy fallback"
          fi
          if [ "${{ inputs.proxy_only }}" = "true" ]; then
            export KMART_FORCE_PROXY=1
            echo "proxy_only ticked: going through KMART_PROXY"
          fi
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python monitor.py --test-alert
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python monitor.py --at-quarter --schedule "${{ github.event.schedule }}"
          else
            python monitor.py   # manual run: check right away
          fi

      - name: Commit state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update monitor state"
            git pull --rebase
            git push
          fi
